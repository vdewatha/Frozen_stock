services:
  postgres:
    extends:
      file: compose.test.yaml
      service: postgres
  redis:
    extends:
      file: compose.test.yaml
      service: redis
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  tests:
    image: frozen-stock-tests:local
    working_dir: /app
    volumes:
      - ../../artifacts/api-server/backend/app:/app/app:ro
      - ./test_network_faults.py:/fault/test_network_faults.py:ro
    environment:
      PYTHONPATH: /app
      FAULT_DRILL: "1"
      DATABASE_URL: postgresql+psycopg://postgres@toxiproxy:15432/paper_tests
      REDIS_URL: redis://toxiproxy:16379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      toxiproxy: {condition: service_started}
    command: [python, -m, pytest, -q, -p, "no:cacheprovider", /fault/test_network_faults.py]
networks:
  default:
    internal: true
