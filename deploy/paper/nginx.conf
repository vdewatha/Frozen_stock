resolver 127.0.0.11 valid=5s ipv6=off;

map "$request_method:$http_authorization" $paper_authorization {
    default $http_authorization;
    "GET:" "Bearer ${LOCAL_VIEWER_KEY}";
    "HEAD:" "Bearer ${LOCAL_VIEWER_KEY}";
}

upstream paper_backend {
    zone paper_backend 64k;
    server backend:8000 resolve;
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://paper_backend;
        proxy_set_header Host $host;
        proxy_set_header Authorization $paper_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
