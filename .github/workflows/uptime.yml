name: Uptime

# Outside freeze alert for the deployed paper bot. Opens an issue labelled
# "uptime: down" (or "uptime: halted") and closes it on recovery; see
# .github/scripts/uptime_check.py.
#
# Each run watches for about 5.5 hours, checking every 2 minutes, then starts
# the next run itself. Scheduled runs alone proved far too sparse (two in a
# night for a */10 cron); the hourly cron only restarts the chain if it broke.
# A run that arrives while one is watching waits as the single pending run.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    name: Check deployment
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Probe startup and heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
          APP_URL: ${{ vars.UPTIME_URL || 'https://frozenstock.replit.app' }}
          ALERT_MENTION: "@${{ github.repository_owner }}"
          UPTIME_WATCH_SECONDS: "19800"
          UPTIME_INTERVAL_SECONDS: "120"
        run: python3 .github/scripts/uptime_check.py
      - name: Start the next watch run
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run uptime.yml --ref main --repo "${{ github.repository }}"
