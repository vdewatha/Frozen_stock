name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: artifacts/api-server/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/api-server/backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.1.1 pytest-timeout==2.4.0
      # The Celery crash-recovery integration tests start their own redis-server
      # and refuse to skip without it. apt also starts a system service on 6379;
      # stop it so the other tests see no broker (as on a dev machine) instead of
      # waiting on Celery workers that never answer.
      - name: Install redis-server
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q redis-server
          sudo systemctl stop redis-server
          sudo systemctl disable redis-server
      # Otherwise SQLite fixtures only: no database, broker or market-data access.
      - name: Run tests
        # A hung test fails with its stack instead of stalling the job.
        run: PYTHONPATH=. python -m pytest -v -p no:warnings --timeout=300 --durations=20 tests

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
